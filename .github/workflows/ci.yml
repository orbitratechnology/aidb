name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web (format, lint, types, tests, build)
    # Branches in this repository are covered by their push run; pull_request runs are for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
      # Every file that holds the version agrees, and a release tag names it.
      - run: node scripts/check-version.mjs
      - name: Report the interface's size
        run: node scripts/size-report.mjs

  e2e:
    name: End to end (responsive, accessibility, keyboard)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Playwright's own image for the pinned version: the browser and its system libraries
    # without an apt install. The user matches the runner's, as Playwright's CI guide shows.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
      # The production-built interface with a large database: screen switches, the schema tree,
      # the grid. Timings go to the job summary.
      - run: pnpm --filter @aidb/desktop e2e:performance
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: apps/desktop/test-results/
          retention-days: 7

  rust:
    name: Rust (fmt, clippy, tests)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Ubuntu's mirrors are sometimes slow: keep downloaded packages between runs (refreshed
      # weekly), so a run only fetches package lists and what changed.
      - id: apt-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ runner.os }}-${{ github.job }}-${{ steps.apt-week.outputs.week }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-
            apt-${{ runner.os }}-
      - name: Install Tauri system dependencies and a Secret Service for credential tests
        timeout-minutes: 20
        run: >-
          scripts/ci-install-apt.sh libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev gnome-keyring dbus
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # tauri::generate_context! embeds the built frontend, so it must exist before compiling.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Round-trips a secret through the real Secret Service (gnome-keyring, throwaway keyring).
      - name: Test the OS credential store
        run: |
          dbus-run-session -- sh -c 'printf "ci\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null \
            && cargo test -p aidb --locked os_store -- --ignored'
      # `cargo test` regenerates the TypeScript contracts; committed copies must match.
      - name: Check generated TypeScript contracts are current
        run: |
          git status --porcelain -- packages/contracts/src/generated
          test -z "$(git status --porcelain -- packages/contracts/src/generated)"

  postgres:
    name: PostgreSQL ${{ matrix.postgres }} integration
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The PRD's supported range; each runs the latest minor release of the official image.
        postgres: ['15', '16', '17', '18']
    steps:
      - uses: actions/checkout@v7
      # Ubuntu's mirrors are sometimes slow: keep downloaded packages between runs (refreshed
      # weekly), so a run only fetches package lists and what changed.
      - id: apt-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ runner.os }}-${{ github.job }}-${{ steps.apt-week.outputs.week }}
          restore-keys: |
            apt-${{ runner.os }}-${{ github.job }}-
            apt-${{ runner.os }}-
      - name: Install Tauri system dependencies and the PostgreSQL client
        timeout-minutes: 20
        run: >-
          scripts/ci-install-apt.sh libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev postgresql-client
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: postgres
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      # Docker image with TLS on and a throwaway CA; prints the exact server version.
      - name: Start PostgreSQL ${{ matrix.postgres }}
        run: scripts/postgres-fixture.sh start ${{ matrix.postgres }}
      - name: Run the adapter, IPC, policy and scripted assistant tests against it
        run: |
          source target/postgres-fixture/env
          cargo test -p aidb --locked --test postgres -- --ignored
          cargo test -p aidb --locked --lib session_commands_work_over_ipc -- --ignored
          cargo test -p aidb --locked --test agent_eval -- --ignored scripted
          cargo test -p aidb --locked --test policy -- --ignored
          cargo test -p aidb --locked --test data_changes -- --ignored
          cargo test -p aidb --locked --test schema_diff -- --ignored
          cargo test -p aidb --locked --test advisor -- --ignored
      # A release gate: canary secrets must not reach files, logs or the webview. It installs
      # the global logger, so it runs on its own, at the most verbose level.
      - name: Scan for secrets
        run: |
          source target/postgres-fixture/env
          AIDB_LOG=trace cargo test -p aidb --locked --lib secret_scan -- --ignored
      # Large catalogs and tables, with generous budgets; once, on the middle of the range.
      - name: Measure performance
        if: matrix.postgres == '17'
        run: |
          source target/postgres-fixture/env
          cargo test -p aidb --locked --test performance -- --ignored --nocapture
      - name: Stop PostgreSQL
        if: always()
        run: scripts/postgres-fixture.sh stop

  audit:
    name: Dependency audit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: audit
      # RustSec's own tool, checking Cargo.lock against the advisory database. Unmaintained
      # crates are reported as warnings; known vulnerabilities fail the job.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Packages that ship in the app; build and test tools are not in the product.
      - run: pnpm audit --prod --audit-level moderate

  platform:
    name: ${{ matrix.name }} tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
          - name: macOS Apple Silicon
            runner: macos-latest
          - name: macOS Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: cargo test --workspace --locked
      # A throwaway keychain, made the default and unlocked, so the test never waits for a
      # password prompt.
      - name: Prepare a keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci aidb-ci.keychain
          security set-keychain-settings aidb-ci.keychain
          security unlock-keychain -p ci aidb-ci.keychain
          security list-keychains -d user -s aidb-ci.keychain
          security default-keychain -s aidb-ci.keychain
      # Round-trips a secret through Credential Manager or the Keychain.
      - name: Test the OS credential store
        run: cargo test -p aidb --locked os_store -- --ignored
      # GitHub's Windows images ship PostgreSQL (PGBIN); macOS gets it from Homebrew.
      - name: Install PostgreSQL 17
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install postgresql@17
            echo "PG_BIN=$(brew --prefix postgresql@17)/bin" >> "$GITHUB_ENV"
          else
            echo "PG_BIN=$PGBIN" >> "$GITHUB_ENV"
          fi
      - name: Start PostgreSQL 17
        run: scripts/postgres-fixture.sh start 17
      - name: Run the integration tests against it
        run: |
          source target/postgres-fixture/env
          cargo test -p aidb --locked --test postgres -- --ignored
          cargo test -p aidb --locked --lib session_commands_work_over_ipc -- --ignored
          cargo test -p aidb --locked --test agent_eval -- --ignored scripted
          cargo test -p aidb --locked --test policy -- --ignored
          cargo test -p aidb --locked --test data_changes -- --ignored
          cargo test -p aidb --locked --test schema_diff -- --ignored
          cargo test -p aidb --locked --test advisor -- --ignored
      - name: Scan for secrets
        run: |
          source target/postgres-fixture/env
          AIDB_LOG=trace cargo test -p aidb --locked --lib secret_scan -- --ignored
      - name: Stop PostgreSQL
        if: always()
        run: scripts/postgres-fixture.sh stop

  bundle:
    name: ${{ matrix.name }} packages
    needs: [web, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu LTS, as Tauri recommends: the packages then run on it
          # and on newer distributions (glibc is backward compatible, not forward).
          - name: Linux x64
            runner: ubuntu-22.04
            bundles: deb rpm appimage
            artifact: aidb-linux-x64
          - name: Windows x64
            runner: windows-latest
            bundles: msi nsis
            artifact: aidb-windows-x64
          - name: macOS Apple Silicon
            runner: macos-latest
            bundles: dmg
            artifact: aidb-macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            bundles: dmg
            artifact: aidb-macos-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # Ubuntu's mirrors are sometimes slow: keep downloaded packages between runs (refreshed
      # weekly), so a run only fetches package lists and what changed.
      - id: apt-week
        if: runner.os == 'Linux'
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: runner.os == 'Linux'
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ matrix.runner }}-${{ github.job }}-${{ steps.apt-week.outputs.week }}
          restore-keys: |
            apt-${{ matrix.runner }}-${{ github.job }}-
            apt-${{ matrix.runner }}-
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: >-
          scripts/ci-install-apt.sh libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Developer ID signing and notarization, once the maintainer adds the certificate as
      # repository secrets (docs/release-checklist.md). Tauri reads these variables; without
      # them the bundles stay signed ad hoc. Only set variables are passed on, since Tauri
      # treats a present but empty one as configured.
      - name: Use the macOS signing certificate if configured
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              # The delimiter form keeps multi-line values (a base64 certificate) intact.
              delimiter="EOF_$(openssl rand -hex 8)"
              { echo "$name<<$delimiter"; echo "${!name}"; echo "$delimiter"; } >> "$GITHUB_ENV"
              echo "$name is configured"
            fi
          done
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
      # The same build packaged again as the next patch version, to test upgrading. These
      # packages are only for the smoke tests.
      - name: Package the build again as a newer version
        run: |
          current=$(node -p "require('./src-tauri/tauri.conf.json').version")
          next=$(node -p "const [a, b, c] = '$current'.split('.').map(Number); [a, b, c + 1].join('.')")
          mkdir -p dist/release dist/upgrade
          find target/release/bundle -maxdepth 2 -type f -name "*$current*" \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) \
            -exec cp {} dist/release/ \;
          pnpm tauri bundle --bundles ${{ matrix.bundles }} --config "{\"version\":\"$next\"}"
          find target/release/bundle -maxdepth 2 -type f -name "*$next*" \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) \
            -exec cp {} dist/upgrade/ \;
          ls -l dist/release dist/upgrade
      - name: Report the packages' sizes
        run: |
          {
            echo "### Packages: ${{ matrix.name }}"
            echo
            echo "| Package | Size |"
            echo "| --- | ---: |"
            for file in dist/release/*; do
              echo "| \`$(basename "$file")\` | $(( $(wc -c < "$file") / 1048576 )) MB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-upgrade-${{ matrix.artifact }}
          path: dist/upgrade/*
          if-no-files-found: error
          retention-days: 1
      # Windows and macOS packages carry what they need (WebView2 and WebKit are part of the
      # OS), so they are tested here; Linux packages are tested on fresh machines below.
      - name: Smoke test the MSI installer
        if: runner.os == 'Windows'
        run: node scripts/smoke-test.mjs msi dist/release/*.msi dist/upgrade/*.msi
      - name: Smoke test the NSIS installer
        if: runner.os == 'Windows'
        run: node scripts/smoke-test.mjs nsis dist/release/*-setup.exe dist/upgrade/*-setup.exe
      - name: Smoke test the disk image
        if: runner.os == 'macOS'
        run: node scripts/smoke-test.mjs dmg dist/release/*.dmg dist/upgrade/*.dmg

  smoke-ubuntu:
    name: ${{ matrix.runner }} smoke test
    needs: bundle
    # The Linux packages are tested even if another platform's packaging failed; a missing
    # artifact still fails the job.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          name: aidb-linux-x64
          path: dist/release
      - uses: actions/download-artifact@v7
        with:
          name: smoke-upgrade-aidb-linux-x64
          path: dist/upgrade
      - id: apt-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ matrix.runner }}-${{ github.job }}-${{ steps.apt-week.outputs.week }}
          restore-keys: |
            apt-${{ matrix.runner }}-${{ github.job }}-
      # A display, and the graphics and font libraries every desktop has: an AppImage carries
      # the app's own libraries but, by design, uses the system's OpenGL/EGL drivers and fonts.
      # The .deb pulls everything else in through its dependencies.
      - name: Install a virtual display and a desktop's graphics libraries
        timeout-minutes: 20
        run: >-
          scripts/ci-install-apt.sh xvfb xauth libegl1 libgl1 libgles2 libgbm1 libgl1-mesa-dri
          libfontconfig1 libfreetype6
      # The AppImage first, while the machine has none of the app's libraries.
      - name: Smoke test the AppImage
        run: xvfb-run -a node scripts/smoke-test.mjs appimage dist/release/*.AppImage dist/upgrade/*.AppImage
      - name: Smoke test the Debian package
        env:
          APT_ARCHIVES: /home/runner/.cache/apt-archives
        run: xvfb-run -a node scripts/smoke-test.mjs deb dist/release/*.deb dist/upgrade/*.deb
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/apt-archives

  smoke-fedora:
    name: Fedora smoke test
    needs: bundle
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: fedora:45
    steps:
      - name: Install Node.js and a virtual display
        run: dnf install -y --setopt=install_weak_deps=False nodejs xorg-x11-server-Xvfb xauth which procps-ng
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: aidb-linux-x64
          path: dist/release
      - uses: actions/download-artifact@v7
        with:
          name: smoke-upgrade-aidb-linux-x64
          path: dist/upgrade
      - name: Smoke test the RPM package
        run: xvfb-run -a node scripts/smoke-test.mjs rpm dist/release/*.rpm dist/upgrade/*.rpm

  # On a version tag, once every test and smoke test has passed: a draft GitHub release with
  # the packages, their SHA-256 checksums, and the changelog's section as notes. The
  # maintainer reviews and publishes it (docs/release-checklist.md).
  release:
    name: Draft the release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [web, e2e, rust, postgres, audit, platform, bundle, smoke-ubuntu, smoke-fedora]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-version.mjs
      - uses: actions/download-artifact@v7
        with:
          pattern: aidb-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { section = index($0, "[" v "]") > 0; next }
            section { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag
          --title "aidb ${GITHUB_REF_NAME#v}" --notes-file notes.md
