[package]
name = "aidb"
description = "Local-first desktop database client with an optional natural-language agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "aidb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = ["isolation"] }

[dependencies]
keyring = "4.2.0"
percent-encoding = "2.3.2"
regex = "1.13.1"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "postgres", "tls-rustls-ring-native-roots", "migrate", "macros", "derive"] }
tauri = { version = "2.12.5", features = ["isolation"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi", "registry", "std"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
zeroize = "1.9.1"

[lints]
workspace = true

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
ts-rs = "12.0.1"
