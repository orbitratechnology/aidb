[package]
name = "aidb"
description = "Local-first desktop database client with an optional natural-language agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "aidb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = ["isolation"] }

[dependencies]
regex = "1.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = ["isolation"] }
tauri-plugin-opener = "2.7.2"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi", "registry", "std"] }
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
ts-rs = "12.0.1"
